<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub — Register</title>
    <link rel="stylesheet" href="/public/css/styles.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">FoodieHub</div>
            <ul class="nav-links">
                <li><a href="index.html">Menu</a></li>
                <li><a href="cart.html">Cart <span id="cart-badge">0</span></a></li>
                <li><a href="order-history.html">My Orders</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="admin-dashboard.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Create Account</h1>
            <form id="register-form" onsubmit="return validateRegister()">
                <label for="register-name">Full Name:</label>
                <input type="text" id="register-name" placeholder="John Doe">
                <span id="register-name-error" class="error-message"></span>

                <label for="register-email">Email:</label>
                <input type="email" id="register-email" placeholder="you@example.com">
                <span id="register-email-error" class="error-message"></span>

                <label for="register-phone">Phone (10 digits):</label>
                <input type="text" id="register-phone" placeholder="0123456789">
                <span id="register-phone-error" class="error-message"></span>

                <label for="register-password">Password (min 6 chars):</label>
                <input type="password" id="register-password" placeholder="Min 6 characters">
                <span id="register-password-error" class="error-message"></span>

                <button type="submit">Register</button>
            </form>
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FoodieHub. Built with Hunger and Passion.</p>
    </footer>

    <script src="/public/js/menu.js"></script>
    <script src="/public/js/cart.js"></script>
    <script src="/public/js/validation.js"></script>
    <script src="/public/js/admin.js"></script>
    <script src="/public/js/fetch.js"></script>
</body>

</html>
