<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub — Cart</title>
    <link rel="stylesheet" href="/public/css/styles.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">FoodieHub</div>
            <ul class="nav-links">
                <li><a href="index.html">Menu</a></li>
                <li><a href="cart.html">Cart <span id="cart-badge">0</span></a></li>
                <li><a href="order-history.html">My Orders</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="admin-dashboard.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Your Cart</h1>
        <section id="cart-items">
            <!-- cart.js populates this -->
        </section>
        <div id="cart-total">Total: $0.00</div>

        <form id="checkout-form" onsubmit="return validateCheckout()">
            <h3>Checkout</h3>
            <label for="delivery-address">Delivery Address:</label>
            <input type="text" id="delivery-address" placeholder="123 Main St, Cairo" required>

            <label for="schedule-time">Schedule for Later (Optional):</label>
            <input type="datetime-local" id="schedule-time">

            <label for="payment-method">Payment Method:</label>
            <select id="payment-method">
                <option value="card">Credit Card</option>
                <option value="cash">Cash on Delivery</option>
            </select>

            <button type="submit">Place Order</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 FoodieHub. Built with Hunger and Passion.</p>
    </footer>

    <script src="/public/js/menu.js"></script>
    <script src="/public/js/cart.js"></script>
    <script src="/public/js/validation.js"></script>
    <script src="/public/js/admin.js"></script>
    <script src="/public/js/fetch.js"></script>
</body>

</html>
