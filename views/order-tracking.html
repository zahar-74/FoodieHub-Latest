<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub — Track Order</title>
    <link rel="stylesheet" href="/public/css/styles.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">FoodieHub</div>
            <ul class="nav-links">
                <li><a href="index.html">Menu</a></li>
                <li><a href="cart.html">Cart <span id="cart-badge">0</span></a></li>
                <li><a href="order-history.html">My Orders</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="admin-dashboard.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="tracking-container">
            <h1>Order #<span id="order-id">1234</span></h1>

            <div id="status-stepper">
                <div class="step active" data-step="0">Placed</div>
                <div class="step" data-step="1">Preparing</div>
                <div class="step" data-step="2">Out for Delivery</div>
                <div class="step" data-step="3">Delivered</div>
            </div>

            <div id="current-status">
                <p>Current Status: <strong id="status-text">Placed</strong></p>
            </div>

            <button onclick="window.location.href='index.html'" class="back-link">← Back to Menu</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FoodieHub. Built with Hunger and Passion.</p>
    </footer>

    <script src="/public/js/menu.js"></script>
    <script src="/public/js/cart.js"></script>
    <script src="/public/js/validation.js"></script>
    <script src="/public/js/admin.js"></script>
    <script src="/public/js/fetch.js"></script>
</body>

</html>
