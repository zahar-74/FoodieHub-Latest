<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub — Manage Menu</title>
    <link rel="stylesheet" href="/public/css/styles.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">FoodieHub Admin</div>
            <ul class="nav-links">
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="admin-orders.html">Manage Orders</a></li>
                <li><a href="admin-menu-manage.html">Manage Menu</a></li>
                <li><a href="index.html">View Site</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Manage Menu Items</h1>

        <section>
            <h2>Add New Item</h2>
            <form id="add-item-form" onsubmit="return validateAddItem()">
                <label for="item-name">Name:</label>
                <input type="text" id="item-name" placeholder="e.g., Pepperoni Pizza">

                <label for="item-price">Price ($):</label>
                <input type="number" id="item-price" step="0.01" placeholder="9.99">

                <label for="item-stock">Stock:</label>
                <input type="number" id="item-stock" placeholder="50">

                <label for="item-category">Category:</label>
                <select id="item-category">
                    <option value="Pizza">Pizza</option>
                    <option value="Burgers">Burgers</option>
                    <option value="Salads">Salads</option>
                    <option value="Drinks">Drinks</option>
                    <option value="Desserts">Desserts</option>
                </select>

                <button type="submit">Add Item</button>
            </form>
        </section>

        <section>
            <h2>Current Menu</h2>
            <table id="admin-menu-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Available</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- admin.js populates this -->
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FoodieHub Admin</p>
    </footer>

    <script src="/public/js/menu.js"></script>
    <script src="/public/js/cart.js"></script>
    <script src="/public/js/validation.js"></script>
    <script src="/public/js/admin.js"></script>
    <script src="/public/js/fetch.js"></script>
</body>

</html>
