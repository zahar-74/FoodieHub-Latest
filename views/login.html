<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub — Login</title>
    <link rel="stylesheet" href="/public/css/styles.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">FoodieHub</div>
            <ul class="nav-links">
                <li><a href="index.html">Menu</a></li>
                <li><a href="cart.html">Cart <span id="cart-badge">0</span></a></li>
                <li><a href="order-history.html">My Orders</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="admin-dashboard.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Login</h1>
            <form id="login-form" onsubmit="return validateLogin()">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" placeholder="you@example.com">
                <span id="login-email-error" class="error-message"></span>

                <label for="login-password">Password:</label>
                <input type="password" id="login-password" placeholder="Enter password">
                <span id="login-password-error" class="error-message"></span>

                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="register.html">Register here</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FoodieHub. Built with Hunger and Passion.</p>
    </footer>

    <script src="/public/js/menu.js"></script>
    <script src="/public/js/cart.js"></script>
    <script src="/public/js/validation.js"></script>
    <script src="/public/js/admin.js"></script>
    <script src="/public/js/fetch.js"></script>
</body>

</html>
