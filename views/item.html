<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub — Item Detail</title>
    <link rel="stylesheet" href="/public/css/styles.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">FoodieHub</div>
            <ul class="nav-links">
                <li><a href="index.html">Menu</a></li>
                <li><a href="cart.html">Cart <span id="cart-badge">0</span></a></li>
                <li><a href="order-history.html">My Orders</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="admin-dashboard.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="item-detail" class="item-detail-container">
            <a href="index.html" class="back-link">&larr; Back to Menu</a>
            <div class="item-card">
                <div id="item-image-container">
                    <img id="item-image" class="item-image" src="" alt="">
                </div>
                <div class="item-body">
                    <h1 id="item-name" class="item-name"></h1>
                    <p id="item-description" class="item-description"></p>
                    <p id="item-price" class="item-price"></p>

                    <label for="item-customizations">Customizations</label>
                    <textarea id="item-customizations" placeholder="e.g. extra cheese, no onions"></textarea>

                    <label for="item-quantity">Quantity</label>
                    <input type="number" id="item-quantity" value="1" min="1">

                    <button id="add-to-cart-btn" class="add-to-cart-btn">Add to Cart</button>
                </div>
            </div>
            <section id="reviews-section" class="reviews-section">
                <h2>Reviews</h2>

                <form id="review-form">
                    <label for="review-rating">Rating (1-5)</label>
                    <input type="number" id="review-rating" min="1" max="5" required>

                    <label for="review-comment">Comment</label>
                    <textarea id="review-comment" required></textarea>

                    <button type="submit">Submit Review</button>
                </form>

                <div id="reviews-list">
                    <!-- reviews.js will fill this in -->
                </div>
            </section>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FoodieHub. Built with Hunger and Passion.</p>
    </footer>

    <script src="/public/js/menu.js"></script>
    <script src="/public/js/cart.js"></script>
    <script src="/public/js/validation.js"></script>
    <script src="/public/js/admin.js"></script>
    <script src="/public/js/fetch.js"></script>
    <script src="/public/js/reviews.js"></script>
</body>

</html>
